# guardrail-serve + CPU semantic sidecar. Run the build on the designated build
# host only (see README.md). The sidecar publishes no port and is attached only to
# the `sidecar` network, which is `internal: true`: it has no route to the outside
# (the model is baked in and the runtime is offline). Only the guardrail service,
# which also joins the default network to publish its port, can reach it.
#
#   docker compose -f deploy/semantic-sidecar/compose.yaml up --build
#
# The default model (Llama Prompt Guard 2 86M) is gated: export HF_TOKEN in the build
# shell only. It is a BuildKit secret, never an argument or environment of the image, and
# the runtime is offline. Other pinned models: --env-file profiles/<name>.env
# (the public fallback needs no token). Read docs/adr/0020-llama-prompt-guard-2.md first:
# the image contains Llama Materials (Llama 4 Community License).
name: guardrail-semantic

services:
  guardrail:
    build:
      context: ../..
    ports:
      - "127.0.0.1:${GUARDRAIL_PORT:-8000}:8000"
    environment:
      API_PORT: "8000"
      SEMANTIC_ENABLED: "true"
      SEMANTIC_URL: http://semantic-sidecar:8080/classify
      SEMANTIC_FORMAT: scores
      # Budget for ONE text, all chunk batches included. Measured on 2 shared vCPUs
      # (about 0.125 s per 510-rune chunk, English): 2s fails around 12000 chars, 5s
      # around 19000. 10s covers MAX_TEXT_CHARS=20000 at low load; concurrent requests
      # queue behind a serialized sidecar, so recalibrate on your hardware (README.md).
      SEMANTIC_TIMEOUT: ${SEMANTIC_TIMEOUT:-10s}
      SEMANTIC_THRESHOLD: ${SEMANTIC_THRESHOLD:-0.9}
      SEMANTIC_FAILURE_MODE: ${SEMANTIC_FAILURE_MODE:-closed}
      GUARDRAILS_CONFIG_DIR: /policies
      LITELLM_DEFAULT_POLICY: semantic
      GUARDRAIL_API_KEYS: ${GUARDRAIL_API_KEYS:-}
    volumes:
      - ../../examples/semantic/policies:/policies:ro
    depends_on:
      semantic-sidecar:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, sidecar]

  semantic-sidecar:
    build:
      context: .
      args:
        MODEL_ID: ${SIDECAR_MODEL_ID:-meta-llama/Llama-Prompt-Guard-2-86M}
        MODEL_REVISION: ${SIDECAR_MODEL_REVISION:-a8ded8e697ce7c355e395a0df51f94adb4a2fd27}
        MODEL_SAFETENSORS_SHA256: ${SIDECAR_MODEL_SAFETENSORS_SHA256-e72017dbbe89c1232dcbc4a74ce0c389db5b468c42afd05850347b2a8c5f6b09}
        MODEL_NOTICE: ${SIDECAR_MODEL_NOTICE:-notices/llama4.txt}
        IMAGE_LICENSES: ${SIDECAR_IMAGE_LICENSES:-MIT AND LicenseRef-Llama-4-Community-License}
        MODEL_ATTRIBUTION: ${SIDECAR_MODEL_ATTRIBUTION:-Built with Llama}
      # Absent or empty token: public models still build; the gated default fails cleanly.
      secrets:
        - hf_token
    image: guardrail-serve-semantic-sidecar:local
    environment:
      # The 86M and 22M checkpoints ship no id2label: LABEL_1 is the malicious class.
      SIDECAR_MALICIOUS_LABELS: ${SIDECAR_MALICIOUS_LABELS:-LABEL_1}
      SIDECAR_VERIFY_LABELS: ${SIDECAR_VERIFY_LABELS:-true}
      SIDECAR_MAX_TOKENS: ${SIDECAR_MAX_TOKENS:-512}
      SIDECAR_MAX_TEXTS: ${SIDECAR_MAX_TEXTS:-32}
      SIDECAR_MAX_BODY_BYTES: ${SIDECAR_MAX_BODY_BYTES:-1048576}
      SIDECAR_MAX_INFLIGHT: ${SIDECAR_MAX_INFLIGHT:-4}
      SIDECAR_INFERENCE_TIMEOUT_SECONDS: ${SIDECAR_INFERENCE_TIMEOUT_SECONDS:-10}
      SIDECAR_BATCH_SIZE: ${SIDECAR_BATCH_SIZE:-8}
      SIDECAR_TORCH_THREADS: ${SIDECAR_TORCH_THREADS:-2}
      # SIGTERM waits at most this long for in-flight requests; stop_grace_period must stay above it.
      SIDECAR_SHUTDOWN_GRACE_SECONDS: ${SIDECAR_SHUTDOWN_GRACE_SECONDS:-20}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    # Above SIDECAR_SHUTDOWN_GRACE_SECONDS (20). That grace exceeds the worst total request
    # duration observed (about 16.5 s: the 10 s deadline plus about 6.5 s for the micro-batch
    # in flight); it covers what was observed, not every CPU or batch size.
    stop_grace_period: 25s
    networks: [sidecar]

networks:
  sidecar:
    internal: true

secrets:
  hf_token:
    environment: HF_TOKEN
