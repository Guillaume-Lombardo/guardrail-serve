name: Evaluation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision build dependencies (no datasets or models)
        run: go mod download
      - name: Evaluate versioned fixtures offline over loopback HTTP
        run: scripts/eval-offline.sh
      - name: Upload text-free evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval
          path: .agent-tmp/eval/*.json
          if-no-files-found: warn
