    regex: '(?:(?:^|[.!?;:,(\[{<>«»\"“”*#|\n-]|\b(?:et|puis|alors|maintenant|donc|desormais|stp|svp|please|ensuite|mais|ok|bon|aussi|d''abord|a\s*present|a\s*partir\s*de\s*maintenant|des\s*maintenant)\b)\s*|\b(?:peux-tu|pourrais-tu|pouvez-vous|pourriez-vous|tu\s*peux|tu\s*pourrais|tu\s*dois|vous\s*devez|tu\s*vas|vous\s*allez|veuillez|merci\s*d[e'']|je\s*veux\s*que\s*tu|je\s*te\s*demande\s*d[e'']|je\s*vous\s*demande\s*d[e'']|il\s*faut|essaie\s*d[e'']|essayez\s*d[e'']|n''hesitez?\s*pas\s*a)\s*)(?P<match>\b(?:revele[rz]?|affiche[rz]?|montre[rz]?|divulgue[rz]?|devoile[rz]?|donne[rz]?|ecris|ecrivez|ecrire|recopie[rz]?|repete[rz]?|cite[rz]?|imprime[rz]?|partage[rz]?|liste[rz]?|dis|dites|copie[rz]?|recrache[rz]?|reproduis|reproduisez|retranscris|retranscrivez)\b[^.!?\n]{0,40}?(?:\b(?:ton|votre|your)\s*prompt\b|\b(?:ton|ta|tes|votre|vos|your)\s*(?:[\w''-]+\s*){0,1}?(?:prompts?\s*(?:systeme|system)|message\s*systeme|(?:instructions?|consignes?|directives?)\s*(?:systeme|initiale?s?|cachee?s?|secrete?s?|internes?|d''origine|originale?s?|de\s*depart|completes?|du\s*developpeur))|\b(?:le|la|les|l''|ce|ces|cette|du|des|the)\s*(?:prompts?\s*(?:systeme|system|cache|secret|initial|interne|d''origine|original|developpeur)|system\s*prompt|message\s*(?:systeme|cache|initial)|(?:instructions?|consignes?|directives?)\s*(?:systeme|initiale?s?|cachee?s?|secrete?s?|internes?|d''origine|originale?s?|de\s*depart|completes?|du\s*developpeur)|texte\s*(?:au-?\s*dessus|qui\s*precede|avant\s*ce\s*message))|(?:instructions?|consignes?|prompts?|message)\s*(?:que\s*tu\s*as\s*recue?s?|qu''on\s*t''a\s*(?:donnee?s?|fournie?s?|transmise?s?)|que\s*vous\s*avez\s*recue?s?)))'
