# Prompt-injection rules. Rules without a channel match the normalized text
# (strip + NFKC, ADR 0013). French rules use channel: folded (ADR 0018): they
# match a matching-only view that is lowercase, without diacritics, with
# Latin lookalikes, digits used as letters and spaced-out letters folded, and
# report original spans through the (?P<match>...) group. Their regexes are
# written in folded form (no accents, lowercase). exempt_quoted_analysis
# ignores a match inside a quotation that the rest of the text only analyses.
patterns:
  - name: ignore_instructions
    type: PROMPT_INJECTION
    regex: '(?i)\b(ignore|disregard|override)\b.{0,40}\b(previous|prior|above|system|developer)\b.{0,40}\b(instructions?|prompt)\b'
  - name: forget_everything
    type: PROMPT_INJECTION
    regex: '(?i)\b(?:forget|disregard)\s+(?:everything|all)\s+(?:(?:that\s+)?you\s+(?:were|have\s+been)\s+(?:told|given)|(?:written\s+)?(?:above|before))\b'
  - name: reveal_prompt
    type: PROMPT_INJECTION
    regex: '(?i)\b(reveal|show|print|dump|display)\b.{0,40}\b(system|developer|hidden)\b.{0,20}\b(prompt|instructions?)\b'
  - name: bypass_safety
    type: PROMPT_INJECTION
    regex: '(?i)\b(bypass|disable|ignore)\b.{0,30}\b(safety|guardrails?|restrictions?|filters?)\b'
  - name: tool_exfiltration
    type: PROMPT_INJECTION
    regex: '(?i)\b(show|list|dump|print)\b.{0,30}\b(?:(?:internal|available|your|hidden)\s+tools?|(?:tool|function)\s+schemas?|system\s+functions?)\b'
  - name: role_override
    type: PROMPT_INJECTION
    regex: '(?i)\byou are now\b.{0,40}\b(system|developer|root|admin)\b'
  - name: hostile_tools
    type: PROMPT_INJECTION
    regex: '(?i)\b(?:use|call|invoke|utilise[rz]?|appelle|appele[rz]|détourne[rz]?)\b.{0,30}\b(?:tools?|functions?|outils?|fonctions?)\b.{0,40}\b(?:exfiltrate|steal|bypass|voler|exfiltrer|contourner)\b'
  # Imperative (tu/vous) or requested override of earlier, system or the assistant's own instructions.
  - name: ignore_instructions_fr
    type: PROMPT_INJECTION
    channel: folded
    exempt_quoted_analysis: true
    regex: '(?:(?:^|[.!?;:,(\[{<>«»\"“”*#|\n-]|\b(?:et|puis|alors|maintenant|donc|desormais|stp|svp|please|ensuite|mais|ok|bon|aussi|d''abord|a\s*present|a\s*partir\s*de\s*maintenant|des\s*maintenant)\b)\s*|\b(?:peux-tu|pourrais-tu|pouvez-vous|pourriez-vous|tu\s*peux|tu\s*pourrais|tu\s*dois|vous\s*devez|tu\s*vas|vous\s*allez|veuillez|merci\s*d[e'']|je\s*veux\s*que\s*tu|je\s*te\s*demande\s*d[e'']|je\s*vous\s*demande\s*d[e'']|il\s*faut|essaie\s*d[e'']|essayez\s*d[e'']|n''hesitez?\s*pas\s*a)\s*)(?P<match>(?:ignore[rz]?|ignorons|oublie[rz]?|oublions|ne\s*(?:tiens|tenez|prends|prenez)\s*(?:plus|pas|aucun)\s*(?:en\s*)?compte|(?:ne\s*)?(?:pas|plus)\s*(?:tenir|prendre)\s*(?:en\s*)?compte|(?:fais|faites|faire)\s*(?:abstraction|fi)|passe[rz]?\s*outre|outrepasse[rz]?|laisse[rz]?\s*tomber|ecarte[rz]?|neglige[rz]?|efface[rz]?)\s*(?:(?:(?:toute?s?|tous)\s*)?(?:tes|vos|ta|ton|votre|your|de\s*(?:tes|vos|ton|ta|votre))\s*(?:[\w''-]+\s*){0,2}?(?:instructions?|consignes?|regles?|directives?|ordres?|indications?|prompts?|rules?|guidelines?|contraintes?|restrictions?|limitations?|programmation)|(?:(?:toute?s?|tous)\s*(?:les|tes|vos|ces)|les|tes|vos|ces|ta|ton|votre|la|le|l''|des|du|de\s*(?:tes|vos|ces|la|l''|toutes\s*(?:les|tes|vos))|your|all|the|any)\s*(?:[\w''-]+\s*){0,3}?(?:instructions?|consignes?|regles?|directives?|ordres?|indications?|prompts?|rules?|guidelines?|contraintes?|restrictions?|limitations?|programmation)[^.!?\n]{0,40}?(?:precedente?s?|anterieure?s?|ci-?\s*dessus|plus\s*haut|au-?\s*dessus|initiale?s?|d''origine|originale?s?|de\s*depart|de\s*base|du\s*(?:systeme|developpeur|concepteur|createur|prompt)|systeme|developpeur|qu''on\s*(?:t''a|vous\s*a)|que\s*l''on\s*(?:t''a|vous\s*a)|que\s*(?:tu\s*as|vous\s*avez)\s*recue?s?|recue?s?|jusqu''ici|jusqu''a\s*(?:present|maintenant)|au\s*debut|en\s*vigueur|actuelle?s?|habituelle?s?|de\s*securite|de\s*moderation|de\s*confidentialite|internes?|cachee?s?|secrete?s?|previous|prior|above|earlier|system|de\s*(?:ton|ta|tes|votre|vos)|d''